services:
  renmx-aiflow-demo-pg:
    container_name: renmx-aiflow-demo-pg
    image: postgres:18
    ports:
      - 5438:5432
    environment:
      POSTGRES_USER: renmx
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql
    # 日志配置
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: "3"
    # Qdrant 向量数据库
    miaoma-aiflow-qdrant:
      image: qdrant/qdrant:latest
      container_name: miaoma-aiflow-qdrant
      ports:
        - '6333:6333' # REST API
        - '6334:6334' # gRPC
      volumes:
        - ./qdrant_storage:/qdrant/storage
      logging:
        driver: 'json-file'
        options:
          max-size: '100m'
          max-file: '3'
